<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BUWUH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f8fc;
      color: #222;
    }

    header {
      background: #087ea4;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #087ea4;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #087ea4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
      background: #066b8b;
    }

    .secondary {
      background: #e7f3f8;
      color: #087ea4;
    }

    .danger {
      background: #e74c3c;
      padding: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccdce3;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #087ea4;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .item-form {
      background: #f2f8fc;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .item {
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item strong {
      color: #087ea4;
      font-size: 17px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: #087ea4;
      margin-top: 8px;
    }

    .kosong {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>BUWUH</h1>
  <p>Pencatatan Buwuhan</p>
</header>

<main>

  <!-- BERANDA -->
  <section id="beranda">

    <div class="card">
      <h2>Selamat Datang</h2>

      <p>
        Catat buwuhan berupa uang dan berbagai
        macam barang sesuai pemberian.
      </p>
    </div>

    <div class="card">

      <h2>Menu</h2>

      <button onclick="bukaTambah()">
        ➕ Tambah Buwuh
      </button>

      <button onclick="bukaData()">
        📋 Data Buwuh
      </button>

      <button onclick="bukaLaporan()">
        📊 Laporan
      </button>

    </div>

  </section>


  <!-- TAMBAH BUWUH -->
  <section id="tambah" class="hidden">

    <div class="card">

      <h2 id="judulTambah">Tambah Buwuh</h2>

      <label>Nama Pemberi</label>

      <input
        type="text"
        id="nama"
        placeholder="Contoh: Budi"
      >

      <label>Uang (Rp)</label>

      <input
        type="number"
        id="uang"
        placeholder="Kosongkan jika tidak ada"
      >

      <label>Barang / Item</label>

      <div id="daftarItem"></div>

      <button
        class="secondary"
        onclick="tambahItem()">

        ＋ Tambah Item

      </button>

      <label>Keterangan</label>

      <textarea
        id="keterangan"
        placeholder="Keterangan tambahan..."
      ></textarea>

      <button onclick="simpanBuwuh()">
        💾 Simpan Buwuh
      </button>

      <button
        class="secondary"
        onclick="kembali()">

        ← Kembali

      </button>

    </div>

  </section>


  <!-- DATA BUWUH -->
  <section id="data" class="hidden">

    <div class="card">

      <h2>📋 Data Buwuh</h2>

      <input
        type="search"
        id="pencarian"
        placeholder="🔍 Cari nama atau barang..."
        oninput="cariData()"
        style="margin-bottom:15px;"
      >

      <div id="daftarData">

        <div class="kosong">
          Belum ada data.
        </div>

      </div>

      <button
        class="secondary"
        onclick="kembali()">

        ← Kembali

      </button>

    </div>

  </section>


  <!-- LAPORAN -->
  <section id="laporan" class="hidden">

    <div class="card">

      <h2>📊 Laporan</h2>

      <p>Jumlah pemberi:</p>

      <div
        class="total"
        id="jumlahPemberi">

        0 orang

      </div>

      <p>Total uang:</p>

      <div
        class="total"
        id="totalUang">

        Rp0

      </div>

      <h3>Daftar Barang</h3>

      <div id="laporanBarang">
        Belum ada barang.
      </div>

      <button
        class="secondary"
        onclick="kembali()">

        ← Kembali

      </button>

    </div>

  </section>

</main>


<script>

  let dataBuwuh =
    JSON.parse(localStorage.getItem("dataBuwuh")) || [];

  let nomorItem = 0;

  let editIndex = -1;


  // =========================
  // NAVIGASI
  // =========================

  function sembunyikanSemua() {

    document
      .getElementById("beranda")
      .classList.add("hidden");

    document
      .getElementById("tambah")
      .classList.add("hidden");

    document
      .getElementById("data")
      .classList.add("hidden");

    document
      .getElementById("laporan")
      .classList.add("hidden");

  }


  function bukaTambah() {

    sembunyikanSemua();

    editIndex = -1;

    document
      .getElementById("judulTambah")
      .textContent = "Tambah Buwuh";

    document
      .getElementById("tambah")
      .classList.remove("hidden");

    document
      .getElementById("daftarItem")
      .innerHTML = "";

    nomorItem = 0;

    document
      .getElementById("nama")
      .value = "";

    document
      .getElementById("uang")
      .value = "";

    document
      .getElementById("keterangan")
      .value = "";

  }


  function bukaData() {

    sembunyikanSemua();

    document
      .getElementById("pencarian")
      .value = "";

    tampilkanData();

    document
      .getElementById("data")
      .classList.remove("hidden");

  }


  function bukaLaporan() {

    sembunyikanSemua();

    tampilkanLaporan();

    document
      .getElementById("laporan")
      .classList.remove("hidden");

  }


  function kembali() {

    sembunyikanSemua();

    document
      .getElementById("beranda")
      .classList.remove("hidden");

  }


  // =========================
  // TAMBAH ITEM
  // =========================

  function tambahItem() {

    nomorItem++;

    const div =
      document.createElement("div");

    div.className = "item-form";

    div.id = "item-" + nomorItem;

    div.innerHTML = `

      <label>Nama Barang</label>

      <input
        type="text"
        class="nama-item"
        placeholder="Contoh: Rokok"
      >

      <label>Jumlah</label>

      <input
        type="number"
        class="jumlah-item"
        placeholder="Contoh: 2"
        step="0.01"
      >

      <label>Satuan</label>

      <input
        type="text"
        class="satuan-item"
        placeholder="Contoh: bungkus, kg, liter"
      >

      <button
        class="danger"
        onclick="hapusItem(${nomorItem})">

        🗑️ Hapus Item

      </button>

    `;

    document
      .getElementById("daftarItem")
      .appendChild(div);

  }


  function hapusItem(id) {

    const item =
      document.getElementById("item-" + id);

    if (item) {
      item.remove();
    }

  }


  // =========================
  // SIMPAN / EDIT
  // =========================

  function simpanBuwuh() {

    const nama =
      document
        .getElementById("nama")
        .value
        .trim();

    if (!nama) {

      alert("Nama pemberi harus diisi.");

      return;

    }


    const uang =
      Number(
        document
          .getElementById("uang")
          .value
      ) || 0;


    const semuaItem =
      document.querySelectorAll(".item-form");


    const items = [];


    semuaItem.forEach(form => {

      const namaItem =
        form
          .querySelector(".nama-item")
          .value
          .trim();


      const jumlah =
        Number(
          form
            .querySelector(".jumlah-item")
            .value
        ) || 0;


      const satuan =
        form
          .querySelector(".satuan-item")
          .value
          .trim();


      if (namaItem) {

        items.push({

          nama: namaItem,

          jumlah: jumlah,

          satuan: satuan

        });

      }

    });


    const keterangan =
      document
        .getElementById("keterangan")
        .value
        .trim();


    const data = {

      nama: nama,

      uang: uang,

      items: items,

      keterangan: keterangan,

      tanggal:
        new Date()
          .toLocaleDateString("id-ID")

    };


    if (editIndex === -1) {

      // DATA BARU
      dataBuwuh.push(data);

    } else {

      // UPDATE DATA LAMA
      dataBuwuh[editIndex] = data;

      editIndex = -1;

    }


    localStorage.setItem(
      "dataBuwuh",
      JSON.stringify(dataBuwuh)
    );


    alert("Buwuh berhasil disimpan.");


    kembali();

  }


  // =========================
  // TAMPILKAN DATA
  // =========================

  function tampilkanData() {

    const tempat =
      document.getElementById("daftarData");


    if (dataBuwuh.length === 0) {

      tempat.innerHTML = `
        <div class="kosong">
          Belum ada data.
        </div>
      `;

      return;

    }


    tempat.innerHTML = "";


    dataBuwuh.forEach((item, index) => {

      tempat.innerHTML +=
        buatTampilanData(item, index);

    });

  }


  // =========================
  // TEMPLATE DATA
  // =========================

  function buatTampilanData(item, index) {

    let daftarBarang = "";


    if (
      item.items &&
      item.items.length > 0
    ) {

      item.items.forEach(barang => {

        daftarBarang += `

          <p>
            📦 ${barang.nama}
            — ${barang.jumlah}
            ${barang.satuan}
          </p>

        `;

      });

    }


    return `

      <div class="item">

        <strong>
          ${index + 1}. ${item.nama}
        </strong>

        <p>
          💵 Uang:
          Rp${(item.uang || 0).toLocaleString("id-ID")}
        </p>

        ${daftarBarang}

        ${
          item.keterangan
          ? `<p>📝 ${item.keterangan}</p>`
          : ""
        }

        <small>
          ${item.tanggal}
        </small>

        <button
          onclick="editBuwuh(${index})">

          ✏️ Edit

        </button>

        <button
          class="danger"
          onclick="hapusBuwuh(${index})">

          🗑️ Hapus

        </button>

      </div>

    `;

  }


  // =========================
  // PENCARIAN
  // =========================

  function cariData() {

    const kata =
      document
        .getElementById("pencarian")
        .value
        .toLowerCase()
        .trim();


    if (!kata) {

      tampilkanData();

      return;

    }


    const hasil = [];


    dataBuwuh.forEach((item, index) => {

      const nama =
        (item.nama || "")
          .toLowerCase()
          .includes(kata);


      const keterangan =
        (item.keterangan || "")
          .toLowerCase()
          .includes(kata);


      const barang =
        item.items &&
        item.items.some(itemBarang =>
          (itemBarang.nama || "")
            .toLowerCase()
            .includes(kata)
        );


      if (
        nama ||
        keterangan ||
        barang
      ) {

        hasil.push({
          item: item,
          index: index
        });

      }

    });


    const tempat =
      document.getElementById("daftarData");


    if (hasil.length === 0) {

      tempat.innerHTML = `

        <div class="kosong">
          Data tidak ditemukan.
        </div>

      `;

      return;

    }


    tempat.innerHTML = "";


    hasil.forEach(data => {

      tempat.innerHTML +=
        buatTampilanData(
          data.item,
          data.index
        );

    });

  }


  // =========================
  // EDIT
  // =========================

  function editBuwuh(index) {

    const item =
      dataBuwuh[index];


    if (!item) return;


    editIndex = index;


    sembunyikanSemua();


    document
      .getElementById("tambah")
      .classList.remove("hidden");


    document
      .getElementById("judulTambah")
      .textContent = "Edit Buwuh";


    document
      .getElementById("nama")
      .value =
      item.nama || "";


    document
      .getElementById("uang")
      .value =
      item.uang || "";


    document
      .getElementById("keterangan")
      .value =
      item.keterangan || "";


    const daftar =
      document.getElementById("daftarItem");


    daftar.innerHTML = "";

    nomorItem = 0;


    if (
      item.items &&
      item.items.length > 0
    ) {

      item.items.forEach(barang => {

        tambahItem();


        const form =
          daftar.lastElementChild;


        form
          .querySelector(".nama-item")
          .value =
          barang.nama || "";


        form
          .querySelector(".jumlah-item")
          .value =
          barang.jumlah || "";


        form
          .querySelector(".satuan-item")
          .value =
          barang.satuan || "";

      });

    }

  }


  // =========================
  // HAPUS
  // =========================

  function hapusBuwuh(index) {

    const yakin =
      confirm(
        "Yakin ingin menghapus data buwuh ini?"
      );


    if (!yakin) return;


    dataBuwuh.splice(index, 1);


    localStorage.setItem(
      "dataBuwuh",
      JSON.stringify(dataBuwuh)
    );


    cariData();

  }


  // =========================
  // LAPORAN
  // =========================

  function tampilkanLaporan() {

    let uang = 0;

    const barang = {};


    dataBuwuh.forEach(item => {

      uang +=
        Number(item.uang) || 0;


      if (item.items) {

        item.items.forEach(data => {

          const nama =
            (data.nama || "")
              .toLowerCase()
              .trim();


          if (!nama) return;


          if (!barang[nama]) {

            barang[nama] = {

              jumlah: 0,

              satuan:
                data.satuan || ""

            };

          }


          barang[nama].jumlah +=
            Number(data.jumlah) || 0;

        });

      }

    });


    document
      .getElementById("jumlahPemberi")
      .textContent =
      dataBuwuh.length +
      " orang";


    document
      .getElementById("totalUang")
      .textContent =
      "Rp" +
      uang.toLocaleString("id-ID");


    const tempat =
      document.getElementById("laporanBarang");


    const daftar =
      Object.keys(barang);


    if (daftar.length === 0) {

      tempat.innerHTML =
        "Belum ada barang.";

      return;

    }


    tempat.innerHTML = "";


    daftar.forEach(nama => {

      tempat.innerHTML += `

        <p>

          📦 <strong>
            ${nama}
          </strong>

          :

          ${barang[nama].jumlah}

          ${barang[nama].satuan}

        </p>

      `;

    });

  }

</script>

</body>
        </html>
