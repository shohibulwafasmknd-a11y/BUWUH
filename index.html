<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BUWUH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #222;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #2e7d32;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #2e7d32;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>BUWUH</h1>
    <p>Pencatatan Buwuhan</p>
  </header>

  <main>

    <div class="card">
      <h2>Selamat Datang</h2>
      <p>
        Catat buwuhan berupa uang, beras, gula,
        rokok, dan barang lainnya.
      </p>
    </div>

    <div class="card">
      <h2>Menu</h2>

      <button>➕ Tambah Buwuh</button>
      <button>📋 Data Buwuh</button>
      <button>📊 Laporan</button>
    </div>

  </main>

</body>
</html>
